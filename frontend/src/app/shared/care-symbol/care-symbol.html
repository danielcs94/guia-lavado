<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  @switch (group()) {
    @case ('wash') {
      <path d="M4 13q4-3 8 0t8 0t8 0t8 0" />
      <path d="M5 13l3.5 17h23L35 13" />
      @if (value() === 'hand') {
        <path d="M15 27v-7m3.5 7v-9m3.5 9v-9m3.5 9v-6M13 27h14" />
      }
      @if (value() === 'none') {
        <path d="M5 5l30 30M35 5L5 35" />
      }
    }
    @case ('temp') {
      <path d="M4 13q4-3 8 0t8 0t8 0t8 0" />
      <path d="M5 13l3.5 17h23L35 13" />
      <text x="20" y="26.5" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" stroke="none">{{ value() }}</text>
    }
    @case ('cycle') {
      <path d="M4 10q4-3 8 0t8 0t8 0t8 0" />
      <path d="M5 10l3 14h24l3-14" />
      @if (value() !== 'normal') {
        <path d="M8 29h24" />
      }
      @if (value() === 'very_mild') {
        <path d="M8 34h24" />
      }
    }
    @case ('bleach') {
      <path d="M20 6l16 27H4z" />
      @if (value() === 'oxygen_only') {
        <path d="M22 14l-8 14m12-11l-6 11" />
      }
      @if (value() === 'none') {
        <path d="M5 5l30 30M35 5L5 35" />
      }
    }
    @case ('tumble') {
      <rect x="5" y="5" width="30" height="30" rx="2" />
      <circle cx="20" cy="20" r="11" />
      @if (value() === 'low') {
        <circle cx="20" cy="20" r="1.8" fill="currentColor" stroke="none" />
      }
      @if (value() === 'normal') {
        <circle cx="16" cy="20" r="1.8" fill="currentColor" stroke="none" />
        <circle cx="24" cy="20" r="1.8" fill="currentColor" stroke="none" />
      }
      @if (value() === 'none') {
        <path d="M5 5l30 30M35 5L5 35" />
      }
    }
    @case ('dry') {
      <rect x="5" y="5" width="30" height="30" rx="2" />
      @switch (value()) {
        @case ('line') {
          <path d="M9 11q11 9 22 0" />
        }
        @case ('drip_line') {
          <path d="M15 11v18m5-18v18m5-18v18" />
        }
        @case ('flat') {
          <path d="M11 20h18" />
        }
        @case ('drip_flat') {
          <path d="M11 17h18m-18 6h18" />
        }
      }
    }
    @case ('iron') {
      <path d="M5 31h30v-5c0-7-5-11-12-11H14l-2 4c-4 1-7 5-7 12z" />
      @switch (value()) {
        @case ('low') {
          <circle cx="21" cy="25" r="1.8" fill="currentColor" stroke="none" />
        }
        @case ('medium') {
          <circle cx="17" cy="25" r="1.8" fill="currentColor" stroke="none" />
          <circle cx="25" cy="25" r="1.8" fill="currentColor" stroke="none" />
        }
        @case ('high') {
          <circle cx="14" cy="25" r="1.8" fill="currentColor" stroke="none" />
          <circle cx="21" cy="25" r="1.8" fill="currentColor" stroke="none" />
          <circle cx="28" cy="25" r="1.8" fill="currentColor" stroke="none" />
        }
        @case ('none') {
          <path d="M5 5l30 30M35 5L5 35" />
        }
      }
    }
    @case ('pro') {
      <circle cx="20" cy="20" r="14" />
      @if (value() === 'none') {
        <path d="M5 5l30 30M35 5L5 35" />
      } @else {
        <text x="20" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">{{ value() }}</text>
      }
    }
  }
</svg>
