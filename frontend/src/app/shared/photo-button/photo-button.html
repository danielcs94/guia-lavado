<label class="photo-button" [class.disabled]="disabled()" [class.secondary]="secondary()">
  @if (multiple()) {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2.5" />
      <circle cx="9" cy="9" r="1.8" />
      <path d="m21 15-4.5-4.5L5 21" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14.5 4h-5L7.5 6.5H4.5a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-3Z" />
      <circle cx="12" cy="13" r="3.5" />
    </svg>
  }
  {{ text() }}
  <input
    type="file"
    accept="image/*"
    [attr.capture]="multiple() ? null : 'environment'"
    [multiple]="multiple()"
    [disabled]="disabled()"
    (change)="onChange($event)"
  />
</label>
